version: '3.8'

services:
  vasup-workspace:
    build: .
    container_name: vasup-workspace
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - ./server/data:/app/server/data
      - ./server/uploads:/app/server/uploads
    environment:
      - PORT=3001
      - NODE_ENV=production
