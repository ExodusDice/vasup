name: Deploy VASUP Workspace

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Build
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vasup-dist
          path: dist/

  # Optional automated deployment trigger (e.g. Render, Vercel, or Webhook)
  deploy:
    name: Deploy to Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Cloud Deploy (if Hook configured)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering automated cloud deployment..."
            curl -X POST "$DEPLOY_HOOK"
            echo "Deployment triggered successfully!"
          else
            echo "No deploy hook secret detected. Automated git integration will handle deployment."
          fi
